name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/ci-scope.yml

  shell:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.apple != 'false' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check Apple container scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh

  test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.backend != 'false' || needs.changes.outputs.compose != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose, runtime resources and Caddy
        if: needs.changes.outputs.compose != 'false'
        run: |
          /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh
      - uses: actions/setup-go@v6
        if: needs.changes.outputs.backend != 'false'
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        if: needs.changes.outputs.backend != 'false'
        run: |
          go version | grep -q 'go1.27.4'
      - name: Unit tests
        if: needs.changes.outputs.backend != 'false'
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        if: needs.changes.outputs.backend != 'false'
        working-directory: backend
        run: make test-integration

  golangci-lint:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.release != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: python -m unittest discover -s tools -p 'test_upstream_release_report.py'
      - run: python -m unittest discover -s deploy/tests -p 'test_deploy_image.py'
      - run: python -m unittest discover -s deploy/tests -p 'test_staging_bot_config.py'
      - run: bash -n .github/release-tools/release-images.sh
      - name: Test CI selection and comparison
        run: python -m unittest discover -s .github/ci

  compare-backend-runs:
    needs: [changes, test, golangci-lint]
    if: >-
      ${{ !cancelled() && needs.changes.outputs.backend != 'false' &&
          ((github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')) ||
           (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Compare with a previous successful run
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.golangci-lint.result }}
        run: python3 .github/ci/ci_reuse_report.py
