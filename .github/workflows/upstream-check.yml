name: Upstream Check

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check report safety
        run: python -m unittest discover -s tools -p test_upstream_release_report.py
      - name: Read the latest upstream release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Wei-Shaw/sub2api/releases/latest > "$RUNNER_TEMP/upstream-release.json"
          gh api "repos/$GITHUB_REPOSITORY/contents/backend/cmd/server/VERSION?ref=main" --jq '.content' \
            | base64 --decode > "$RUNNER_TEMP/main-version.txt"
          python tools/upstream_release_report.py \
            --release "$RUNNER_TEMP/upstream-release.json" \
            --version "$RUNNER_TEMP/main-version.txt" \
            --summary "$GITHUB_STEP_SUMMARY"
