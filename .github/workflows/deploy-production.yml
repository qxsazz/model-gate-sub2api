name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Staging commit SHA whose verified image should be promoted
        required: true
        type: string
      confirm:
        description: Type DEPLOY to confirm the production deployment
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: model-gate-production
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Confirm manual production deployment
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = 'DEPLOY' || {
            echo 'The confirm input must be exactly DEPLOY.' >&2
            exit 1
          }

      - name: Prepare SSH credentials
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Resolve the staging image digest
        id: image
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image='ghcr.io/qxsazz/model-gate-sub2api'
          tag="staging-$SOURCE_SHA"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools inspect "$image:$tag" >/dev/null
          digest="$(docker buildx imagetools inspect "$image:$tag" --format '{{.Manifest.Digest}}')"
          case "$digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) echo 'image digest was not resolved' >&2; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Promoting $image@$digest"

      - name: Verify staging and deploy production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PRODUCTION_DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH || '/opt/sub2api' }}
          STAGING_DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH || '/opt/sub2api-staging' }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          image="ghcr.io/qxsazz/model-gate-sub2api@$IMAGE_DIGEST"
          ssh -i "$RUNNER_TEMP/ssh/deploy_key" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" "$target" \
            "mkdir -p '$PRODUCTION_DEPLOY_PATH'"
          scp -i "$RUNNER_TEMP/ssh/deploy_key" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            deploy/docker-compose.production.override.yml \
            "$target:$PRODUCTION_DEPLOY_PATH/docker-compose.cicd.yml"
          scp -i "$RUNNER_TEMP/ssh/deploy_key" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            deploy/scripts/sub2api-deploy.sh \
            "$target:$PRODUCTION_DEPLOY_PATH/"
          ssh -i "$RUNNER_TEMP/ssh/deploy_key" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" "$target" \
            sh -s -- "$PRODUCTION_DEPLOY_PATH" "$image" <<'REMOTE'
          set -eu
          production_root="$1"
          target_image="$2"
          db_before=$(docker inspect sub2api-postgres --format '{{.Id}}|{{.State.StartedAt}}')
          redis_before=$(docker inspect sub2api-redis --format '{{.Id}}|{{.State.StartedAt}}')
          chmod 700 "$production_root/sub2api-deploy.sh"
          "$production_root/sub2api-deploy.sh" verify-staging "$target_image"
          "$production_root/sub2api-deploy.sh" deploy production "$target_image"
          test "$(docker inspect sub2api --format '{{.Config.Image}}')" = "$target_image"
          test "$db_before" = "$(docker inspect sub2api-postgres --format '{{.Id}}|{{.State.StartedAt}}')"
          test "$redis_before" = "$(docker inspect sub2api-redis --format '{{.Id}}|{{.State.StartedAt}}')"
          release_file=$(ls -1t "$production_root"/releases/deploy-*.env | head -n 1)
          test "$(sed -n 's/^target_image=//p' "$release_file")" = "$target_image"
          backup_file=$(sed -n 's/^backup_file=//p' "$release_file")
          case "$backup_file" in
            "$production_root"/backups/postgres-*.dump) ;;
            *) echo 'release backup path is missing or unexpected' >&2; exit 1 ;;
          esac
          test -s "$backup_file"
          docker exec -i sub2api-postgres pg_restore --list < "$backup_file" >/dev/null
          printf 'production_backup=%s verified=true\n' "${backup_file##*/}"
          printf 'production_database_containers_unchanged=true\n'
          printf 'production_image=%s\n' "$target_image"
          REMOTE

      - name: Verify deployed gateway recovery configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PRODUCTION_DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH || '/opt/sub2api' }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ssh/deploy_key" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker compose --project-name sub2api --env-file '$PRODUCTION_DEPLOY_PATH/.env' -f '$PRODUCTION_DEPLOY_PATH/docker-compose.yml' -f '$PRODUCTION_DEPLOY_PATH/docker-compose.cicd.yml' exec -T sub2api sh" \
            < deploy/scripts/verify-gateway-recovery.sh
