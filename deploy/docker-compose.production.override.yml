# Production-only override. The existing production Compose file remains
# untouched; this file injects the exact image digest during deployment.

services:
  sub2api:
    image: ${SUB2API_IMAGE:?SUB2API_IMAGE is required}
    environment:
      - GATEWAY_RECOVERY_ENABLED=${GATEWAY_RECOVERY_ENABLED:-true}
      - GATEWAY_RECOVERY_BUDGET_SECONDS=${GATEWAY_RECOVERY_BUDGET_SECONDS:-300}
      - GATEWAY_RECOVERY_SELECTION_WAIT_SECONDS=${GATEWAY_RECOVERY_SELECTION_WAIT_SECONDS:-120}
      - GATEWAY_RECOVERY_MAX_ATTEMPTS=${GATEWAY_RECOVERY_MAX_ATTEMPTS:-12}
      - GATEWAY_RECOVERY_MAX_WAITERS=${GATEWAY_RECOVERY_MAX_WAITERS:-256}
      - GATEWAY_RECOVERY_MAX_WAITERS_PER_GROUP=${GATEWAY_RECOVERY_MAX_WAITERS_PER_GROUP:-64}
      - GATEWAY_RECOVERY_MAX_WAITERS_PER_USER=${GATEWAY_RECOVERY_MAX_WAITERS_PER_USER:-2}
