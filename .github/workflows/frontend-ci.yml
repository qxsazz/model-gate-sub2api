name: Frontend CI

on:
  pull_request:
    branches: [staging, main]
  push:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/ci-scope.yml

  checks:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'none' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm run lint:check

      - name: Run frontend tests (includes locale completeness)
        if: needs.changes.outputs.frontend != 'docs'
        working-directory: frontend
        run: pnpm run test:run

      - name: Test documentation and locale completeness
        if: needs.changes.outputs.frontend == 'docs'
        working-directory: frontend
        run: >-
          pnpm exec vitest run src/docs src/components/docs src/views/docs
          src/router/__tests__/docs-route.spec.ts
          src/components/layout/__tests__/docUrlSanitization.spec.ts
          src/i18n/__tests__/localeKeyCompleteness.spec.ts

      - name: Typecheck
        working-directory: frontend
        run: pnpm exec vue-tsc -b

      - name: Build frontend
        working-directory: frontend
        run: pnpm exec vite build

  frontend-boundary:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'frontend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject backend changes in frontend PRs
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}')"
          if printf '%s\n' "$changed" | grep -q '^backend/'; then
            echo 'Frontend-labelled pull requests cannot modify backend/.' >&2
            printf '%s\n' "$changed" | grep '^backend/' >&2
            exit 1
          fi

  canvas:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.canvas != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: canvas/web/package-lock.json
      - name: Install hosted canvas
        working-directory: canvas/web
        run: npm ci
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Test managed models and task history recovery
        working-directory: canvas/web
        run: bun run test
      - name: Check and build hosted canvas
        working-directory: canvas/web
        run: npm run typecheck && npm run build
