name: Upstream Check

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: staging
          fetch-depth: 0

      - name: Check the latest upstream release (read-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          upstream_repo='https://github.com/Wei-Shaw/sub2api.git'
          upstream_web='https://github.com/Wei-Shaw/sub2api'
          upstream_tag="$(gh api repos/Wei-Shaw/sub2api/releases/latest --jq '.tag_name')"
          case "$upstream_tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Latest upstream release is not a semantic version tag: $upstream_tag" >&2
              exit 1
              ;;
          esac

          git remote add upstream "$upstream_repo" 2>/dev/null || git remote set-url upstream "$upstream_repo"
          git fetch --no-tags upstream "refs/tags/$upstream_tag"
          upstream_commit="$(git rev-parse FETCH_HEAD^{commit})"
          git fetch origin staging --quiet
          staging_commit="$(git rev-parse origin/staging^{commit})"

          {
            echo '## Upstream release check'
            echo
            echo "- Latest release: [$upstream_tag]($upstream_web/releases/tag/$upstream_tag)"
            echo "- Upstream commit: \`$upstream_commit\`"
            echo "- Staging commit: \`$staging_commit\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if git merge-base --is-ancestor "$upstream_commit" origin/staging; then
            echo "staging already contains upstream $upstream_tag ($upstream_commit)"
            echo '- Status: already included in `staging`.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::notice title=Upstream release available::$upstream_tag ($upstream_commit) is not contained in staging. Manual review is required."
          echo '- Status: update available; manual review and integration required.' >> "$GITHUB_STEP_SUMMARY"
