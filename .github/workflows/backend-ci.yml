name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/ci-scope.yml

  shell:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.apple != 'false' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check Apple container scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh

  test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.backend != 'false' || needs.changes.outputs.compose != 'false') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - name: Check Docker Compose, runtime resources and Caddy
        if: needs.changes.outputs.compose != 'false'
        run: |
          /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh
      - name: Check prior Go run
        id: prior
        if: needs.changes.outputs.backend != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 .github/ci/go_reuse.py
      - name: Set up Go for CI
        if: needs.changes.outputs.backend != 'false' && steps.prior.outputs.reused != 'true'
        uses: ./.github/actions/setup-go-ci
        with:
          build-cache: test
      - name: Unit tests
        if: needs.changes.outputs.backend != 'false' && steps.prior.outputs.reused != 'true'
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        if: needs.changes.outputs.backend != 'false' && steps.prior.outputs.reused != 'true'
        working-directory: backend
        run: make test-integration
      - name: Publish Go check evidence
        if: steps.prior.outputs.evidence != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.prior.outputs.evidence }}
          path: ${{ runner.temp }}/go-ci-evidence.json
          retention-days: 2
          if-no-files-found: error

  golangci-lint:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - name: Check prior Go run
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 .github/ci/go_reuse.py
      - name: Set up Go for CI
        if: steps.prior.outputs.reused != 'true'
        uses: ./.github/actions/setup-go-ci
        with:
          build-cache: lint
      - name: golangci-lint
        if: steps.prior.outputs.reused != 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend
      - name: Publish Go check evidence
        if: steps.prior.outputs.evidence != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.prior.outputs.evidence }}
          path: ${{ runner.temp }}/go-ci-evidence.json
          retention-days: 2
          if-no-files-found: error

  release-helpers:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.release != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: python -m unittest discover -s tools -p 'test_upstream_release_report.py'
      - run: python -m unittest discover -s deploy/tests -p 'test_deploy_image.py'
      - run: python -m unittest discover -s deploy/tests -p 'test_staging_bot_config.py'
      - run: bash -n .github/release-tools/release-images.sh
      - name: Test CI selection and comparison
        run: python -m unittest discover -s .github/ci
